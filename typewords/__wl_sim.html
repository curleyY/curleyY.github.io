<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>WL SIM (real DOM)</title>
  <style>
    body { margin: 0; background: #eef1f6; font-family: system-ui, "Microsoft YaHei", sans-serif; color: #222; }
    .page { max-width: 920px; margin: 0 auto; padding: 20px; }
    .word-list-section { background: #fff; border-radius: 12px; padding: 12px; }

    /* ---- base styles mimicking the real app ---- */
    .common-list-item { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #eee; }
    .common-list-item .word { font-weight: 600; }
    .common-list-item .phonetic.text-gray { color: #777; }
    .common-list-item .right { flex-shrink: 0; width: 40px; text-align: right; color:#bbb; }

    /* ===== NEW four-column CSS (must match tw-patch.v74.js) ===== */
    .common-list-item { padding: 10px 14px !important; }
    .common-list-item .word { font-weight: 600 !important; }
    .common-list-item .left { display:flex !important; align-items:center !important; flex:1 1 auto !important; min-width:0 !important; }
    .common-list-item .title-wrapper {
      display:grid !important;
      grid-template-columns: minmax(0,1fr) 132px 150px 44px !important;
      align-items:center !important;
      column-gap:1rem !important;
      flex:1 1 auto !important;
      width:100% !important;
      min-width:0 !important;
    }
    .common-list-item .item-title { display:contents !important; }
    .common-list-item .title-wrapper > div:not(.item-title) {
      grid-column:1 !important; grid-row:1 !important; min-width:0 !important; max-height:1.6em !important; overflow:hidden !important;
      display:flex !important; flex-wrap:nowrap !important; align-items:center !important;
    }
    .common-list-item .title-wrapper > div:not(.item-title) * {
      white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; flex-wrap:nowrap !important;
    }
    .common-list-item .item-title > span.phonetic.text-gray {
      grid-column:2 !important; grid-row:1 !important; margin:0 !important; white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; justify-self:start !important;
    }
    .common-list-item .item-title > span.phonetic.text-gray::before { content:"[" !important; }
    .common-list-item .item-title > span.phonetic.text-gray::after { content:"]" !important; }
    .common-list-item .item-title > span.word {
      grid-column:3 !important; grid-row:1 !important; margin:0 !important; white-space:nowrap !important; overflow:hidden !important; text-overflow:ellipsis !important; justify-self:start !important;
    }
    .common-list-item .item-title > span.text-gray-500 {
      grid-column:4 !important; grid-row:1 !important; margin:0 !important; white-space:nowrap !important; justify-self:end !important; text-align:right !important;
    }
    .common-list-item .item-title > .volume { display:none !important; }
  </style>
</head>
<body>
  <div class="page">
    <div class="word-list-section">
      <!-- item 1: short -->
      <div class="common-list-item">
        <div class="left">
          <div class="title-wrapper">
            <div class="item-title">
              <span class="text-sm translate-y-0.5 text-gray-500">1.</span>
              <span class="word">like</span>
              <span class="phonetic text-gray">laɪk</span>
              <svg class="volume" width="16" height="16" viewBox="0 0 20 20"><path d="M9 4l7 4-7 4V4z"></path></svg>
            </div>
            <div>
              <div class="zn"><span>v. 喜欢；希望；愿意；n. 个人偏好或喜爱的事物</span></div>
            </div>
          </div>
        </div>
        <div class="right"></div>
      </div>

      <!-- item 2: long word + multi-def -->
      <div class="common-list-item">
        <div class="left">
          <div class="title-wrapper">
            <div class="item-title">
              <span class="text-sm translate-y-0.5 text-gray-500">2.</span>
              <span class="word">responsibility</span>
              <span class="phonetic text-gray">rɪˌspɒnsəˈbɪləti</span>
              <svg class="volume" width="16" height="16" viewBox="0 0 20 20"><path d="M9 4l7 4-7 4V4z"></path></svg>
            </div>
            <div>
              <div class="zn"><span>n. 责任；职责；义务；可靠性</span></div>
            </div>
          </div>
        </div>
        <div class="right"></div>
      </div>

      <!-- item 3: very long explanation to test truncation -->
      <div class="common-list-item">
        <div class="left">
          <div class="title-wrapper">
            <div class="item-title">
              <span class="text-sm translate-y-0.5 text-gray-500">3.</span>
              <span class="word">burden</span>
              <span class="phonetic text-gray">ˈbɜːdn</span>
              <svg class="volume" width="16" height="16" viewBox="0 0 20 20"><path d="M9 4l7 4-7 4V4z"></path></svg>
            </div>
            <div>
              <div class="zn"><span>n. 负担；责任；船的载货量；vt. 使负担；烦扰；装货于；使负重</span></div>
            </div>
          </div>
        </div>
        <div class="right"></div>
      </div>

      <!-- item 4: with right icon present (showOption) -->
      <div class="common-list-item">
        <div class="left">
          <div class="title-wrapper">
            <div class="item-title">
              <span class="text-sm translate-y-0.5 text-gray-500">4.</span>
              <span class="word">want</span>
              <span class="phonetic text-gray">wɒnt</span>
              <svg class="volume" width="16" height="16" viewBox="0 0 20 20"><path d="M9 4l7 4-7 4V4z"></path></svg>
            </div>
            <div>
              <div class="zn"><span>v. 想要；需要；n. 缺乏；匮乏</span></div>
            </div>
          </div>
        </div>
        <div class="right">★</div>
      </div>
    </div>
  </div>
</body>
</html>
