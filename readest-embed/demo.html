<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Readest Embed Demo</title>
    <style>
      html, body { margin: 0; height: 100%; background: #f3f4f6; }
      #host { height: 100vh; width: 100vw; }
    </style>
  </head>
  <body>
    <div id="host"></div>
    <script type="module">
      const status = document.createElement('div');
      status.id = 'boot-status';
      status.style.cssText = 'position:fixed;top:8px;left:8px;z-index:9999;font:12px sans-serif;color:#333;background:#fff;padding:4px 8px;border:1px solid #ccc';
      status.textContent = 'loading readest-embed.js ...';
      document.body.appendChild(status);
      try {
        const mod = await import('./readest-embed.js');
        status.textContent = 'module loaded, mounting ...';
        const unmount = mod.mountReadest({
          container: document.getElementById('host'),
          initialPath: '/library',
        });
        window.__unmountReadest = unmount;
        status.textContent = 'mounted ✓';
        setTimeout(() => status.remove(), 1500);
      } catch (e) {
        status.textContent = 'ERROR: ' + (e && e.message ? e.message : e);
        status.style.color = 'red';
        console.error(e);
      }
    </script>
  </body>
</html>
