<!DOCTYPE html>
<html lang="zh-CN">
<head>

  <title>正在跳转到 TypeWords…</title>

    // 直接进入背单词应用，避免 AFFiNE 根目录自动跳转 /workspace/... 深链导致 404

        location.replace('/typewords/');
      }
